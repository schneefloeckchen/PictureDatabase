handlers= java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.level = FINER

#
# Default Log Level, falls nicht anders angegeben
.level=SEVERE
initial.level=SEVERE
picdata.level=SEVERE
pictures.level=SEVERE
pictures.ui.ToolsUI.level=SEVERE
pictures.ui.MaintainPictureMediumUI.level=FINE
pictures.tools.PresentationPicturesProcessor.level=FINE

